<div class="container">

  <mat-card>

    <h2>Registro</h2>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="usuario.nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellido</mat-label>
      <input matInput [(ngModel)]="usuario.apellido">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo</mat-label>
      <input matInput [(ngModel)]="usuario.correo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefono</mat-label>
      <input matInput [(ngModel)]="usuario.telefono">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Direccion</mat-label>
      <input matInput [(ngModel)]="usuario.direccion">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" [(ngModel)]="usuario.password">
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="register()">

      Registrarse

    </button>

  </mat-card>

</div>
