<div class="container">

  <mat-card>

    <h2>Login</h2>

    <mat-form-field appearance="outline">
      <mat-label>Correo</mat-label>

      <input
        matInput
        [(ngModel)]="correo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>

      <input
        matInput
        type="password"
        [(ngModel)]="password">
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="login()">

      Ingresar

    </button>

  </mat-card>

</div>
